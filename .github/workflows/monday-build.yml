name: Monday build
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Monday build webhook
        # --fail turns an HTTP error (e.g. a revoked hook) into a failed run
        run: curl --fail --silent --show-error -X POST -d '{}' "https://api.netlify.com/build_hooks/${TOKEN}"
        env:
          TOKEN: ${{ secrets.NETLIFY_MONDAY_BUILD_HOOK }}
